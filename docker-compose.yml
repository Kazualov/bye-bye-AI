services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: inpainting-backend
    ports:
      - "8000:8000"
    volumes:
      # Job inputs/outputs produced by the web app
      - ./storage:/app/storage
      # Model weights (LaMa -> ~/.cache/inpainting-bench, MAT/LPIPS -> HF / torch caches).
      # Kept in a named volume so they are downloaded only once, not on every rebuild.
      - model-cache:/root/.cache
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inpainting-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  model-cache:
